# Preview publication: 7b6e25b76587360b79e15b4a3aba99d0a520da74
name: Publish TO-DO

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: todo-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Get published website
        uses: actions/checkout@v4
        with:
          ref: main
          path: live
      - name: Get mobile preview
        uses: actions/checkout@v4
        with:
          ref: 7b6e25b76587360b79e15b4a3aba99d0a520da74
          path: mobile
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install dependencies
        working-directory: mobile
        run: npm ci
      - name: Test local storage
        working-directory: mobile
        run: npm test
      - name: Build application
        working-directory: mobile
        run: npm run build
      - name: Test mobile interface
        working-directory: mobile
        run: npm run test:ui
      - name: Combine published site and preview
        run: |
          mkdir -p site/mobile-preview
          cp -a live/dist/. site/
          cp -a mobile/dist/. site/mobile-preview/
          cp mobile/dist/reset-password.html mobile/dist/password-reset.js site/
          cp -a mobile/dist/chunks site/
          rm -f site/mobile-preview/CNAME
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish site
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ${{ needs.build.outputs.artifact_name }}
