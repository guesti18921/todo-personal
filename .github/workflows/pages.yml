name: Publish TO-DO

on:
  push:
    branches: [main, web-push-calendar-0.4.29]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: todo-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: todo_push_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-test-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    outputs:
      artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Get current source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Set up Java for signing and clock checks
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Test storage and account logic
        run: npm test
      - name: Test push schema, account isolation and delivery leases
        env:
          PGPASSWORD: ci-test-only
        run: psql -h localhost -U postgres -d todo_push_test -f tests/web-push-schema.sql
      - name: Build application
        run: npm run build
      - name: Test interface
        run: npm run test:ui
      - name: Set up browser
        run: npx playwright install --with-deps chromium
      - name: Test desktop, mobile and network failures
        run: npm run test:browser
      - name: Prepare published site
        run: |
          mkdir -p site/mobile-preview
          cp -a dist/. site/
          cp -a dist/. site/mobile-preview/
          printf '%s\n' 'todo.m1strell.com' > site/CNAME
          rm -f site/mobile-preview/CNAME
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish site
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ${{ needs.build.outputs.artifact_name }}
