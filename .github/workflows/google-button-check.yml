name: Verify Google button change
on:
  push:
    branches: [fix/google-button-visible-20261029]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run test:ui
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
