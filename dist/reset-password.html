<!doctype html>
<html lang="ru"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer"><meta name="robots" content="noindex">
<title>TO-DO Personal — новый пароль</title>
<script>
// Strip credentials before requesting even our own bundle. Never persist them.
window.todoRecoveryFragment = location.hash;
history.replaceState(null, '', location.pathname);
</script>
<style>
*{box-sizing:border-box}body{margin:0;background:#f7f3ee;color:#452138;font:17px system-ui;min-height:100dvh;display:grid;place-items:center}main{width:min(100%,440px);padding:28px}h1{font-size:27px}form{display:grid;gap:12px}input,button{font:inherit;padding:12px;border:1px solid #bcaeb6;border-radius:8px;min-width:0}input{width:100%;background:white}button{cursor:pointer;background:#452138;color:white}button:disabled{opacity:.6;cursor:wait}p{line-height:1.5}a{color:inherit;display:inline-block;margin:12px 0}[hidden]{display:none!important}:focus-visible{outline:3px solid #40b2a2;outline-offset:3px}
</style></head><body><main>
<h1 id="heading">Новый пароль</h1><p id="status" role="status" aria-live="polite">Проверяем ссылку…</p>
<form id="reset-form" hidden>
<label for="new-password" id="password-label">Новый пароль — минимум 8 символов</label>
<input id="new-password" type="password" autocomplete="new-password" minlength="8" required>
<label for="repeat-password" id="repeat-label">Повторите пароль</label>
<input id="repeat-password" type="password" autocomplete="new-password" minlength="8" required>
<button id="show-password" type="button" aria-pressed="false">Показать пароль</button>
<button id="save-password" type="submit">Сохранить пароль</button>
</form>
<button id="retry" type="button" hidden>Повторить проверку</button>
<p id="return-message" hidden>Вернитесь в TO-DO Personal и войдите с новым паролем.</p>
<a id="open-app" href="todopersonal://auth-callback" hidden>Открыть Android-приложение</a>
</main><script src="password-reset.js" defer></script></body></html>
